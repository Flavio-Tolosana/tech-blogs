services:
  tech-blogs:
    image: ${IMAGE_NAME}:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-tech-blogs}
    restart: "no"
    environment:
      TZ: ${TZ:-Europe/Madrid}
      OUTPUT_DIR: /data
    volumes:
      - ${TECH_BLOGS_DIR}:/data
    # Ejecuta el script una vez (entrypoint del Dockerfile) y el contenedor sale solo
